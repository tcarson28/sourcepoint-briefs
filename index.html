const ANALYSIS_SYS = `You are SourcePoint's internal intelligence analyst. SourcePoint is a U.S.-founded, China-based product sourcing consultancy. Analyze all provided inputs and produce a structured client intelligence brief.

Required inputs before a proposal can be generated:
1. Product being sourced
2. Quantity
3. Key specifications
4. Budget per unit
5. Delivery destination
6. Timeline or urgency
7. Client relationship type: cold, referral, or returning
8. Branding requirements: unbranded, custom logo, or open

COMPLEXITY SCORING (internal use only, determines category add-on tier):
Score each factor present and total the points.
- Multiple product categories, 2 points per additional category beyond the first
- Sample pulls from more than one factory: 1 point
- Inspection coordination required: 1 point
- Multiple SKUs within a single category: 1 point
- Multi-phase program structure: 1 point
- Custom branding requiring bilingual spec sheet development: 1 point
- Timeline under three weeks from engagement start to order placement: 1 point
- Product development or prototype development: 2 points
- Legal coordination required: 1 point
- Jewelry or precision metalwork category: 1 point (elevated factory vetting, finish consistency risk, IP exposure on branded insignia)
- Electronics or tech-integrated product category: 1 point (certification requirements, component sourcing, safety testing)
Tier thresholds: 0 to 2 points = Standard. 3 to 4 points = Moderate. 5 or above = Complex.

SKU GROUPING RULE (critical): Multiple SKUs within the same product category must be grouped as ONE category row, not as separate categories. A pin program with five SKUs is one category with multiple SKUs. A harness in three colorways is one category. Only create separate category rows when products require different factories, different supplier searches, or different spec sheet development tracks. Never split SKUs into separate category rows.

Output ONLY this JSON with prefix ANALYSIS_COMPLETE: on its own line:

ANALYSIS_COMPLETE:
{"clientName":"","company":"","product":"","quantity":"","specifications":"","budgetPerUnit":"","destination":"","timeline":"","tier":"founder","relationshipType":"cold","currentSituation":"2-4 sentences about where client is now","statedGoals":[{"text":"goal one"},{"text":"goal two"}],"productCategories":[{"category":"category name e.g. Milestone Pin Program","addonTier":"standard","skus":[{"sku":"sku name e.g. 50 Year Pin","quantity":"units or range","phase":"Phase 1","notes":"any relevant detail"}]}],"informationGaps":[{"field":"missing input name","question":"question to ask","blocking":true}],"upsellOpportunities":[{"service":"module name","rationale":"why needed","priority":"high"}],"proposalStatus":"blocked","proposalBlockers":[],"complexityScore":0,"complexityTier":"standard","modules":{"includePackage":true,"preShipmentInspection":false,"factoryAudit":false,"qcDocumentation":false,"outOfProvince":false,"isRush":false,"websitePMFee":false,"techPackSimple":false,"techPackComplex":false,"productLaunchPartnership":false},"analystNotes":""}

Rules: blocking true only for the 8 required inputs. proposalStatus ready only when all 8 confirmed. tier is corporate if established organization with procurement function or order above 75000 USD, otherwise founder. statedGoals must always be an array of objects with a text field, never a plain string. SKU GROUPING RULE: multiple SKUs within the same product type must be grouped into ONE productCategories entry, never listed as separate categories. Example: five pin designs are one entry labeled Milestone Pin Program (5 SKUs) not five separate entries. Jewelry and precision metalwork engagements carry elevated complexity due to specialized factory pools, finish consistency requirements across SKUs, and IP exposure risk. Score these engagements at complex tier unless scope is clearly minimal. productCategories must use the nested structure with category name and skus array. Each SKU must have sku name, quantity, phase, and notes fields. Group all SKUs of the same product type under one category entry. If quantities are not mentioned for a category, leave the quantity field as an empty string. complexityScore is the sum of all complexity factor points present including jewelry and electronics factors where applicable. complexityTier is standard for 0 to 2, moderate for 3 to 4, complex for 5 or above. analystNotes must always be populated with 2 to 4 sentences covering: buying signals or hesitation observed, red flags or risks, upsell potential not already captured, and any strategic observations that would inform how to handle this engagement. Output only JSON.`;

const PROPOSAL_SYS = `You are SourcePoint's senior sourcing operator. Generate a complete client-ready sourcing proposal.

SourcePoint: U.S.-founded, China-based sourcing consultancy. Founder: Taylor Carson. Website: sourcepointco.com. Email: hello@sourcepointco.com.

Standard Sourcing Package includes: Supplier search, vetting of 3 suppliers, price benchmarking and negotiation in Mandarin, bilingual spec sheet and product rendering, sample coordination for 2 suppliers, formal supplier recommendation report.

CURRENT FEE SCHEDULE:
Founder standard package: 1200. Returning client package: 950. Corporate package: 3500. Rush supplement: 25 percent added to base package fee for engagements under 21 days.
Additional category pricing per category beyond the first: Founder standard 500, moderate 700, complex 900. Returning standard 400, moderate 550, complex 700. Corporate standard 1000, moderate 1500, complex 2000.
Coordination fee: 10 percent of confirmed order value plus shipping. Minimum 500 total. Split evenly across Stage 3 and Stage 4. Product cost and freight are pass-through payments and do not appear in sourcing fee or coordination fee calculations.

PAYMENT STRUCTURE (4 stages):
Stage 1: 50 percent of total sourcing fee due at proposal acceptance.
Stage 2: Remaining 50 percent of sourcing fee due at sample approval and sourcing phase close.
Stage 3: 50 percent of coordination fee (5 percent of confirmed order value plus shipping) due at production coordination start.
Stage 4: Remaining 50 percent of coordination fee (5 percent of confirmed order value plus shipping) due prior to full order shipping.

Generate the proposal as clean plain text with numbered section headers in ALL CAPS. No markdown symbols. No dashes of any kind anywhere including em dashes, en dashes, or hyphens used as punctuation. Use commas or rewrite instead.

Sections: 1. INTRODUCTION 2. GOALS AND PRIORITIES 3. PROPOSED SCOPE OF WORK TIMELINE AND DELIVERABLES 4. PRODUCT SPECIFICATIONS 5. COST STRUCTURE 6. PAYMENT TERMS 7. SCOPE NOTES 8. WHY SOURCEPOINT 9. ACCEPTANCE AND NEXT STEPS

Section 4 PRODUCT SPECIFICATIONS must render the PRODUCT CATEGORIES TABLE as a plain text table. Column headers are: Category | SKU | Quantity | Phase | Notes. For each category, print the category name in the Category column. For the first SKU under a category, print the category name and the SKU details. For subsequent SKUs under the same category, leave the Category column blank and print the SKU details. Separate columns with the pipe character. Each SKU on its own line. Include every category and every SKU from the data. Do not omit any. Do not add any. Do not include Add-on Tier in the table. If no product categories are provided, write NOT YET CONFIRMED in that section.

Rules: Operator tone. Calm and direct. No hype. Fill every field with real data from the brief. Payment Terms section must describe all four stages clearly. Cost Structure must show coordination fee as 10 percent of order value plus shipping with minimum 500, collected in two equal installments at Stages 3 and 4. End with: SourcePoint | U.S.-Founded. China-Based. Real Factory Access.`;

const normaliseGoals = (raw) => {
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.map(g=>typeof g==='string'?{id:uid(),text:g}:{id:uid(),...g});
  if(typeof raw==='string'&&raw.trim()) return [{id:uid(),text:raw.trim()}];
  return [];
};

const extractJSON = (text) => {
  const idx = text.indexOf('ANALYSIS_COMPLETE:');
  if(idx===-1) return null;
  const after = text.substring(idx+18).trim();
  const start = after.indexOf('{');
  if(start===-1) return null;
  let depth=0,end=-1;
  for(let i=start;i<after.length;i++){
    if(after[i]==='{') depth++;
    else if(after[i]==='}'){depth--;if(depth===0){end=i;break;}}
  }
  if(end===-1) return null;
  try{return JSON.parse(after.substring(start,end+1));}catch{return null;}
};

const calcPricing = (tier,mods,rel) => {
  const r = ADDON_RATES[tier||'founder'];
  const lines=[]; let sub=0;
  const add=(label,amt,detail)=>{lines.push({label,amt,detail:detail||''});sub+=amt;};
  if(mods.includePackage){
    const p = tier==='corporate'?STANDARD_PKG.corporate:rel==='returning'?STANDARD_PKG.returning:STANDARD_PKG.founder;
    const detail = rel==='returning'?'Returning client rate':tier==='corporate'?'Corporate rate':'Founder rate';
    add('Standard Sourcing Package',p,detail);
    if(mods.isRush){add('Rush Supplement 25 percent',Math.round(p*0.25),'');}
  }
  if(mods.preShipmentInspection) add('Pre-Shipment Inspection',r.preShipmentInspection,'');
  if(mods.factoryAudit) add('Factory Audit',r.factoryAudit,'');
  if(mods.qcDocumentation) add('QC Documentation',r.qcDocumentation,'');
  if(mods.additionalSiteVisit){const qty=Math.max(1,parseInt(mods.additionalSiteVisitCount)||1);add('Additional Site Visit x'+qty+' (Guangdong)',r.additionalSiteVisit*qty,qty+' visit'+(qty!==1?'s':'')+' beyond included visit');}
  if(mods.outOfProvince) add('Out-of-Province Travel Supplement',r.outOfProvince,'');
  if(mods.websitePMFee) add('Website Development PM Fee',BRAND_RATES.websitePMFee,'');
  if(mods.techPackSimple) add('Tech Pack Simple',BRAND_RATES.techPackSimple,'');
  if(mods.techPackComplex) add('Tech Pack Complex',BRAND_RATES.techPackComplex,'');
  if(mods.productLaunchPartnership) add('Product Launch Partnership',BRAND_RATES.productLaunchPartnership,'Placeholder rate');
  // Category add-ons — first category is base (included), each additional charges by tier
  if(mods.categories&&mods.categories.length>1){
    const relKey=rel==='returning'?'returning':tier==='corporate'?'corporate':'founder';
    const rates=CATEGORY_ADDON_RATES[relKey]||CATEGORY_ADDON_RATES.founder;
    mods.categories.slice(1).forEach((cat,i)=>{
      const tier2=cat.addonTier||'standard';
      const hasContent=(cat.category&&cat.category.trim())||(cat.skus&&cat.skus.some(s=>s.sku&&s.sku.trim()));
      if(tier2!=='base'&&rates[tier2]&&hasContent){
        add('Add-on: '+(cat.category||'Category '+(i+2))+' ('+tier2+')',rates[tier2],'Additional category');
      }
    });
  }
  const s1=Math.round(sub/2);
  return {lines,total:sub,stage1:s1,stage2:sub-s1};
};

const callClaude = async(system,parts,apiKey)=>{
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:3000,system,messages:[{role:'user',content:Array.isArray(parts)?parts:[{type:'text',text:parts}]}]})
  });
  const d=await res.json();
  if(d.error) throw new Error(d.error.message||'API error');
  if(!d.content||!d.content[0]) throw new Error('No response');
  return d.content[0].text;
};

const fetchUrl = async(url)=>{
  const res = await fetch('/.netlify/functions/fetch-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  if(!res.ok) throw new Error('Function error '+res.status);
  return await res.json();
};

const readAsBase64=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
const readAsText=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file);});
const IMG_TYPES={'image/jpeg':1,'image/jpg':1,'image/png':1,'image/webp':1,'image/gif':1};

const processFile = async(file)=>{
  const item={id:uid(),name:file.name,type:file.type,size:file.size};
  if(IMG_TYPES[file.type]){item.kind='image';item.base64=await readAsBase64(file);return item;}
  if(file.type==='application/pdf'){item.kind='pdf';item.base64=await readAsBase64(file);return item;}
  if(file.type.startsWith('text/')||['.txt','.eml','.md','.csv'].some(e=>file.name.toLowerCase().endsWith(e))){item.kind='text';item.textContent=await readAsText(file);return item;}
  return null;
};

const buildParts = (transcript,notes,mnText,mnImages,files,links)=>{
  const parts=[];
  (mnImages||[]).forEach(f=>{parts.push({type:'image',source:{type:'base64',media_type:f.type==='image/jpg'?'image/jpeg':f.type,data:f.base64}});});
  (files||[]).filter(f=>f.kind==='image').forEach(f=>{parts.push({type:'image',source:{type:'base64',media_type:f.type==='image/jpg'?'image/jpeg':f.type,data:f.base64}});});
  (files||[]).filter(f=>f.kind==='pdf').forEach(f=>{parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:f.base64}});});
  let text='';
  if(transcript&&transcript.trim()) text+='CALL TRANSCRIPT:\n'+transcript.trim()+'\n\n';
  if(mnText&&mnText.trim()) text+='MEETING NOTES (typed):\n'+mnText.trim()+'\n\n';
  if((mnImages||[]).length>0) text+='MEETING NOTES: '+mnImages.length+' handwritten photo(s) attached above.\n\n';
  if(notes&&notes.trim()) text+='OPERATOR NOTES:\n'+notes.trim()+'\n\n';
  (files||[]).filter(f=>f.kind==='text').forEach(f=>{text+='ATTACHED FILE ('+f.name+'):\n'+f.textContent+'\n\n';});
  const vl=(links||[]).filter(l=>l.url&&l.url.trim());
  vl.forEach(l=>{
    const heading=(l.label?l.label+' ('+l.url+')':l.url);
    if(l.fetchStatus==='fetched'&&l.fetchedText) text+='FETCHED WEBSITE CONTENT '+heading+':\n'+l.fetchedText+'\n\n';
    else text+='REFERENCE LINK '+heading+'\n\n';
  });
  if(!text.trim()) text='Analyze the attached files only.';
  parts.push({type:'text',text:text.trim()});
  return parts;
};

const fetchAllLinks = async(links)=>{
  const toFetch=links.filter(l=>l.url&&l.url.trim()&&!l.fetchStatus);
  if(!toFetch.length) return links;
  const results=await Promise.allSettled(toFetch.map(l=>fetchUrl(l.url).then(r=>({id:l.id,r}))));
  return links.map(l=>{
    const m=results.find(x=>x.status==='fulfilled'&&x.value.id===l.id);
    if(!m) return l;
    const r=m.value.r;
    return r.success?{...l,fetchStatus:'fetched',fetchedText:r.text,fetchedTitle:r.title||''}:{...l,fetchStatus:'blocked',fetchedText:null,fetchedTitle:'',fetchError:r.error||'Could not fetch'};
  });
};

function InlineEdit({value,onSave,displayStyle,inputStyle}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(value);
  const ref=useRef(null);
  useEffect(()=>setVal(value),[value]);
  const commit=()=>{setEditing(false);if(val!==value)onSave(val);};
  if(editing) return React.createElement('input',{ref,value:val,onChange:e=>setVal(e.target.value),onBlur:commit,onKeyDown:e=>e.key==='Enter'&&commit(),style:{...inputStyle,border:'1px solid #0056A8',borderRadius:2,padding:'2px 6px',background:'#EBF4FF',width:'100%'}});
  return React.createElement('div',{onClick:()=>{setEditing(true);setTimeout(()=>ref.current&&ref.current.focus(),10);},style:{...displayStyle,cursor:'text',borderRadius:2,padding:'2px 6px',border:'1px solid transparent',minHeight:20},title:'Click to edit'},val||React.createElement('span',{style:{color:'#CBD5E0',fontStyle:'italic',fontSize:13,fontWeight:400}},'Click to edit'));
}

function EditBlock({value,onSave,placeholder}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(value);
  useEffect(()=>setVal(value),[value]);
  const commit=()=>{setEditing(false);if(val!==value)onSave(val);};
  if(editing) return React.createElement('textarea',{value:val,onChange:e=>setVal(e.target.value),onBlur:commit,autoFocus:true,style:{width:'100%',border:'1px solid #0056A8',borderRadius:2,padding:'8px 10px',fontSize:13,lineHeight:1.7,fontFamily:"'Open Sans',sans-serif",resize:'vertical',minHeight:76,background:'#EBF4FF',color:'#1A202C',boxSizing:'border-box'}});
  return React.createElement('div',{onClick:()=>setEditing(true),style:{fontSize:13,lineHeight:1.7,color:val?'#2D3748':'#CBD5E0',cursor:'text',minHeight:58,fontStyle:val?'normal':'italic',whiteSpace:'pre-wrap'}},val||placeholder);
}

function InvoiceModal({brief,pricing,onClose}){
  const [stage,setStage]=useState('s1');
  const [payMethod,setPayMethod]=useState('wire');
  const [orderValue,setOrderValue]=useState('');
  const [shippingValue,setShippingValue]=useState('');
  const [dueDate,setDueDate]=useState('Upon receipt');
  const [stripeLink,setStripeLink]=useState('');
  const [clientName,setClientName]=useState(brief.clientName||'');
  const [clientCompany,setClientCompany]=useState(brief.company||'');
  const [clientEmail,setClientEmail]=useState('');
  const [clientPhone,setClientPhone]=useState('');
  const [downloading,setDownloading]=useState(false);
  const [copied,setCopied]=useState(false);
  const [invNum]=useState(()=>nextInvoiceNum());
  const pmt=getPmt();
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const coordHalf=()=>{const ov=parseFloat(orderValue)||0;const sv=parseFloat(shippingValue)||0;return Math.max(Math.round((ov+sv)*0.05),250);};
  const lineItems=()=>{
    if(stage==='s1') return [{desc:'Standard Sourcing Package - Stage 1 Deposit (50% of sourcing fee)',amt:pricing.stage1}];
    if(stage==='s2'){const items=[{desc:'Standard Sourcing Package - Stage 2 Balance (remaining 50% of sourcing fee)',amt:pricing.stage2}];ADDON_META.forEach(m=>{if(brief.modules&&brief.modules[m.id]) items.push({desc:m.label,amt:ADDON_RATES[brief.tier||'founder'][m.id]});});BRAND_META.forEach(m=>{if(brief.modules&&brief.modules[m.id]) items.push({desc:m.label,amt:BRAND_RATES[m.id]});});return items;}
    if(stage==='s3'){const ov=parseFloat(orderValue)||0;const sv=parseFloat(shippingValue)||0;return [{desc:'Coordination Fee Stage 3 - 5% of '+fmt(ov)+' order value plus '+fmt(sv)+' shipping (first installment of 10% total)',amt:coordHalf()}];}
    if(stage==='s4'){const ov=parseFloat(orderValue)||0;const sv=parseFloat(shippingValue)||0;return [{desc:'Coordination Fee Stage 4 - 5% of '+fmt(ov)+' order value plus '+fmt(sv)+' shipping (final installment of 10% total)',amt:coordHalf()}];}
    return [];
  };
  const total=()=>lineItems().reduce((s,l)=>s+l.amt,0);
  const needsOrderValue=stage==='s3'||stage==='s4';
  const stageLabel=stage==='s1'?'Stage 1 Deposit':stage==='s2'?'Stage 2 Balance':stage==='s3'?'Stage 3 Coordination First Installment':'Stage 4 Coordination Final Installment';
  const coordNote=(stage==='s3'||stage==='s4')?'Coordination fee is 10% of confirmed order value plus shipping, billed in two equal installments.':null;
  const downloadInvoice=async()=>{
    setDownloading(true);
    try{
      const payload={
        invoiceNumber:'SP-'+invNum,
        date:today,
        dueDate,
        clientName,
        clientCompany,
        clientAddress,
        clientEmail,
        clientPhone,
        lineItems:lineItems(),
        total:total(),
        paymentMethod:payMethod,
        stripeLink:payMethod==='stripe'?stripeLink:null,
        wireDetails:payMethod==='wire'?{bankName:pmt.wireBankName,accountName:pmt.wireAccountName,routingNumber:pmt.wireRoutingNumber,accountNumber:pmt.wireAccountNumber,accountType:pmt.wireAccountType,swift:pmt.wireSwift}:null,
        wiseDetails:payMethod==='wise'?{email:pmt.wiseEmail,accountName:pmt.wiseAccountName,currency:pmt.wiseCurrency,instructions:pmt.wiseInstructions}:null,
        coordNote
      };
      const res=await fetch('/.netlify/functions/generate-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||'Generation failed');}
      const blob=await res.blob();
      const url=window.URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      const n=(clientName||brief.clientName||'Client').replace(/[^a-zA-Z0-9\s]/g,'').replace(/\s+/g,'_');
      a.download='SP_Invoice_'+n+'_SP-'+invNum+'.docx';
      document.body.appendChild(a);a.click();
      window.URL.revokeObjectURL(url);document.body.removeChild(a);
    }catch(e){alert('Download failed: '+e.message);}
    setDownloading(false);
  };
  const payInstructions=()=>{
    if(payMethod==='stripe') return stripeLink?'Pay via Stripe: '+stripeLink+'\nProcessing fees are the responsibility of the client.':'No Stripe link entered.';
    if(payMethod==='wire'){if(!pmt.wireBankName) return 'Wire transfer details not configured. Go to Settings.';return 'Bank: '+pmt.wireBankName+'\nAccount Name: '+(pmt.wireAccountName||'')+'\nRouting ABA: '+(pmt.wireRoutingNumber||'')+'\nAccount Number: '+(pmt.wireAccountNumber||'')+'\nAccount Type: '+(pmt.wireAccountType||'')+(pmt.wireSwift?'\nSWIFT BIC: '+pmt.wireSwift:'');}

    showProposal&&React.createElement(ProposalModal,{brief:b,pricing,apiKey,onClose:()=>setShowProposal(false)}),
    showInvoice&&React.createElement(InvoiceModal,{brief:b,pricing,onClose:()=>setShowInvoice(false)})
  );
}

function App(){
  const [apiKey,setApiKeyState]=useState(()=>getApiKey());const [index,setIndex]=useState([]);const [activeBrief,setActiveBrief]=useState(null);const [view,setView]=useState('home');const [sidebarOpen,setSidebarOpen]=useState(true);const [showSettings,setShowSettings]=useState(false);
  useEffect(()=>{if(apiKey)setIndex(loadIdx());},[apiKey]);
  const handleSaveKey=(k)=>{saveApiKey(k);setApiKeyState(k);setIndex(loadIdx());};
  const openBrief=(id)=>{const b=loadBrief(id);if(b){setActiveBrief(b);setView('brief');}};
  const handleSaved=(b)=>{const ni=saveBrief(b,index);setIndex(ni);setActiveBrief(b);setView('brief');};
  const handleUpdated=(b)=>{const ni=saveBrief(b,index);setIndex(ni);setActiveBrief(b);};
  const handleDelete=(id)=>{const ni=delBrief(id,index);setIndex(ni);setActiveBrief(null);setView('home');};
  if(!apiKey) return React.createElement(SetupView,{onSave:handleSaveKey});
  return React.createElement('div',{style:{display:'flex',height:'100vh',overflow:'hidden',background:'#F0F2F5'}},
    React.createElement(Sidebar,{open:sidebarOpen,onToggle:()=>setSidebarOpen(o=>!o),index,activeBriefId:activeBrief&&activeBrief.id,onSelect:openBrief,onNew:()=>{setActiveBrief(null);setView('new');},onSettings:()=>setShowSettings(true)}),
    React.createElement('div',{style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}},
      view==='home'&&React.createElement(HomeView,{onNew:()=>setView('new'),hasAny:index.length>0}),
      view==='new'&&React.createElement(NewBriefView,{apiKey,onSaved:handleSaved,onCancel:()=>setView('home')}),
      view==='brief'&&activeBrief&&React.createElement(BriefView,{key:activeBrief.id,initialBrief:activeBrief,apiKey,onUpdated:handleUpdated,onDeleted:()=>handleDelete(activeBrief.id)})
    ),
    showSettings&&React.createElement(SettingsModal,{currentKey:apiKey,onSave:(k)=>{handleSaveKey(k);setShowSettings(false);},onClose:()=>setShowSettings(false)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));
</script>
</body>
</html>
